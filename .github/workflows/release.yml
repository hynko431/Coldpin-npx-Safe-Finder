name: Coldpin Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing Git tag (e.g. v1.3.0) to publish release artifacts for; leave empty for dry-run verification'
        required: false
        type: string

# Least-privilege default; every job explicitly declares only the permissions it needs
permissions: {}

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag_check.outputs.release_tag }}
      pkg_ver: ${{ steps.tag_check.outputs.pkg_ver }}
      pkg_name: ${{ steps.tag_check.outputs.pkg_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Validate release tag matches package version
        id: tag_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PKG_VER="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          PKG_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).name")"
          TARGET_TAG=""
          if [ "$EVENT_NAME" = "push" ]; then
            TARGET_TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TARGET_TAG="$REF_NAME"
          fi
          if [ -n "$TARGET_TAG" ]; then
            if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$ ]]; then
              echo "ERROR: Invalid release tag format '${TARGET_TAG}'." >&2
              exit 1
            fi
            if [ "$TARGET_TAG" != "v${PKG_VER}" ]; then
              echo "ERROR: Release tag '${TARGET_TAG}' does not match package.json version 'v${PKG_VER}'." >&2
              exit 1
            fi
          fi
          echo "release_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run full verification pipeline and build reproducible bundles
        run: npm run verify:all

      - name: Verify zero tracked-file or CRLF drift
        run: git diff --exit-code

      - name: Compute SHA-256 checksums for release artifacts
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            coldpin-antigravity.zip \
            coldpin-claude.zip \
            coldpin-openai.zip \
            skillspector-self-audit.sarif > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.0
        with:
          name: coldpin-release-dist
          path: |
            dist/coldpin-antigravity.zip
            dist/coldpin-claude.zip
            dist/coldpin-openai.zip
            dist/skillspector-self-audit.sarif
            dist/SHA256SUMS.txt

  publish-github-release:
    needs: build-and-verify
    if: needs.build-and-verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coldpin-release-dist
          path: dist

      - name: Attest SLSA build provenance for release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/coldpin-antigravity.zip
            dist/coldpin-claude.zip
            dist/coldpin-openai.zip
            dist/skillspector-self-audit.sarif
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-verify.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            dist/coldpin-antigravity.zip \
            dist/coldpin-claude.zip \
            dist/coldpin-openai.zip \
            dist/skillspector-self-audit.sarif \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Coldpin ${RELEASE_TAG}" \
            --generate-notes

  publish-npm:
    needs: [build-and-verify, publish-github-release]
    if: needs.build-and-verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build-and-verify.outputs.release_tag }}

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify keyless npm OIDC environment (npm >= 11.5.1, zero static tokens)
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ] || [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "ERROR: Static NPM_TOKEN/NODE_AUTH_TOKEN must not be set; use keyless npm Trusted Publishing OIDC." >&2
            exit 1
          fi
          npm --version
          node -e '
            const [maj, min, pat] = require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error("npm >= 11.5.1 required for keyless Trusted Publishing OIDC"); process.exit(1); }
          '

      - name: Keyless npm publish with automatic Sigstore provenance (idempotent)
        env:
          PKG_NAME: ${{ needs.build-and-verify.outputs.pkg_name }}
          PKG_VER: ${{ needs.build-and-verify.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "Package ${PKG_NAME}@${PKG_VER} is already published on npm; skipping publish."
          else
            npm publish --access public
          fi

  publish-mcp-registry:
    needs: [build-and-verify, publish-npm]
    if: needs.build-and-verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build-and-verify.outputs.release_tag }}

      - name: Install Cosign for mcp-publisher signature verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and Cosign-verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error -O "${base_url}/${archive}"
          curl --fail --location --silent --show-error -O "${base_url}/${archive}.sigstore.json"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/modelcontextprotocol/registry/\.github/workflows/" \
            "${archive}"
          tar -xzf "${archive}"
          chmod +x ./mcp-publisher

      - name: Validate and publish server.json to Official MCP Registry via GitHub OIDC
        run: |
          set -euo pipefail
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
