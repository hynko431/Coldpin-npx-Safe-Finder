name: Coldpin Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing Git tag (e.g. v1.3.0) to publish release artifacts for; leave empty for dry-run verification"
        required: false
        type: string

# Least-privilege default; every job explicitly declares only the permissions it needs
permissions: {}

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag_check.outputs.release_tag }}
      pkg_ver: ${{ steps.tag_check.outputs.pkg_ver }}
      pkg_name: ${{ steps.tag_check.outputs.pkg_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate release tag matches package version
        id: tag_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PKG_VER="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          PKG_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).name")"
          TARGET_TAG=""
          if [ "$EVENT_NAME" = "push" ]; then
            TARGET_TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TARGET_TAG="$REF_NAME"
          fi
          if [ -n "$TARGET_TAG" ]; then
            if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.+-]+)?$ ]]; then
              echo "ERROR: Invalid release tag format '${TARGET_TAG}'." >&2
              exit 1
            fi
            if [ "$TARGET_TAG" != "v${PKG_VER}" ]; then
              echo "ERROR: Release tag '${TARGET_TAG}' does not match package.json version 'v${PKG_VER}'." >&2
              exit 1
            fi
          fi
          echo "release_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run full verification pipeline and build reproducible bundles
        run: npm run verify:all

      - name: Verify zero tracked-file or CRLF drift
        run: git diff --exit-code

      - name: Compute SHA-256 checksums for release artifacts
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            coldpin-antigravity.zip \
            coldpin-claude.zip \
            coldpin-openai.zip \
            skillspector-self-audit.sarif > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.0
        with:
          name: coldpin-release-dist
          path: |
            dist/coldpin-antigravity.zip
            dist/coldpin-claude.zip
            dist/coldpin-openai.zip
            dist/skillspector-self-audit.sarif
            dist/SHA256SUMS.txt

  publish-github-release:
    needs: build-and-verify
    if: needs.build-and-verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coldpin-release-dist
          path: dist

      - name: Attest SLSA build provenance for release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/coldpin-antigravity.zip
            dist/coldpin-claude.zip
            dist/coldpin-openai.zip
            dist/skillspector-self-audit.sarif
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-verify.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; skipping create."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              dist/coldpin-antigravity.zip \
              dist/coldpin-claude.zip \
              dist/coldpin-openai.zip \
              dist/skillspector-self-audit.sarif \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "Coldpin ${RELEASE_TAG}" \
              --generate-notes
          fi

  publish-npm:
    needs: [build-and-verify, publish-github-release]
    if: needs.build-and-verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.build-and-verify.outputs.release_tag }}

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Verify keyless npm OIDC environment (npm >= 11.5.1, zero static tokens)
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ] || [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "ERROR: Static NPM_TOKEN/NODE_AUTH_TOKEN must not be set; use keyless npm Trusted Publishing OIDC." >&2
            exit 1
          fi
          npm --version
          node -e '
            const [maj, min, pat] = require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error("npm >= 11.5.1 required for keyless Trusted Publishing OIDC"); process.exit(1); }
          '

      - name: Keyless npm publish with automatic Sigstore provenance (idempotent)
        env:
          PKG_NAME: ${{ needs.build-and-verify.outputs.pkg_name }}
          PKG_VER: ${{ needs.build-and-verify.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          # Use a unique query parameter so existence probes never poison Cloudflare's bare-URL 404 cache.
          if curl --fail --silent --show-error --output /dev/null "https://registry.npmjs.org/${PKG_NAME}/${PKG_VER}?coldpin_exists=$(date +%s)"; then
            echo "Package ${PKG_NAME}@${PKG_VER} is already published on npm; skipping publish."
          else
            npm publish --access public
          fi

  publish-mcp-registry:
    needs: [build-and-verify, publish-npm]
    if: needs.build-and-verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      PKG_NAME: ${{ needs.build-and-verify.outputs.pkg_name }}
      PKG_VER: ${{ needs.build-and-verify.outputs.pkg_ver }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.build-and-verify.outputs.release_tag }}

      - name: Install Cosign for mcp-publisher signature verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and Cosign-verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error -O "${base_url}/${archive}"
          curl --fail --location --silent --show-error -O "${base_url}/${archive}.sigstore.json"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/modelcontextprotocol/registry/\.github/workflows/" \
            "${archive}"
          tar -xzf "${archive}"
          chmod +x ./mcp-publisher

      - name: Wait for npm registry metadata and tarball propagation
        run: |
          set -euo pipefail
          MCP_NAME="$(jq -r '.name' server.json)"
          TARBALL_NAME="${PKG_NAME##*/}"
          ready=0
          for attempt in $(seq 1 40); do
            ts="$(date +%s)"
            meta_url="https://registry.npmjs.org/${PKG_NAME}/${PKG_VER}?coldpin_poll=${attempt}_${ts}"
            tgz_url="https://registry.npmjs.org/${PKG_NAME}/-/${TARBALL_NAME}-${PKG_VER}.tgz?coldpin_poll=${attempt}_${ts}"
            if meta_json="$(curl --fail --silent --show-error "$meta_url" 2>/dev/null)" \
              && printf '%s' "$meta_json" | jq -e --arg m "$MCP_NAME" '.mcpName == $m' >/dev/null 2>&1 \
              && curl --fail --silent --head --output /dev/null "$tgz_url" 2>/dev/null; then
              echo "npm origin ready for ${PKG_NAME}@${PKG_VER} (mcpName=${MCP_NAME}) on attempt ${attempt}."
              ready=1
              break
            fi
            echo "Attempt ${attempt}/40: waiting 15s for npm propagation of ${PKG_NAME}@${PKG_VER}..."
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "ERROR: Timed out waiting for ${PKG_NAME}@${PKG_VER} propagation on registry.npmjs.org." >&2
            exit 1
          fi
          # Allow global CDN edge convergence before the MCP Registry queries bare npm URLs.
          sleep 15

      - name: Validate and publish server.json to Official MCP Registry via GitHub OIDC
        run: |
          set -euo pipefail
          MCP_NAME="$(jq -r '.name' server.json)"
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          for attempt in $(seq 1 6); do
            set +e
            out="$(./mcp-publisher publish 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if curl --fail --silent "https://registry.modelcontextprotocol.io/v0.1/servers?search=${MCP_NAME}" \
              | jq -e --arg n "$MCP_NAME" --arg v "$PKG_VER" '.servers[]? | select(.server.name == $n and .server.version == $v)' >/dev/null 2>&1; then
              echo "MCP Registry already lists ${MCP_NAME}@${PKG_VER}; treating as idempotent success."
              exit 0
            fi
            if printf '%s' "$out" | grep -Eiq '404|not found|failed to fetch|502|503|504|timeout|timed out|temporarily unavailable|EOF'; then
              if [ "$attempt" -lt 6 ]; then
                echo "Transient MCP Registry npm verification error (attempt ${attempt}/6); retrying in 65s..."
                sleep 65
                continue
              fi
            fi
            exit "$rc"
          done
          exit 1

  publish-ghcr:
    needs: [build-and-verify, publish-github-release]
    if: needs.build-and-verify.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.build-and-verify.outputs.release_tag }}

      - name: Verify Dockerfile exists on release tag
        run: test -f Dockerfile

      - name: Build and smoke-test container locally before push
        env:
          PKG_VER: ${{ needs.build-and-verify.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          docker build -t coldpin:smoke .
          ver_out="$(docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid coldpin:smoke --version)"
          echo "Container version: ${ver_out}"
          test "$ver_out" = "coldpin v${PKG_VER}"
          init_out="$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ghcr-smoke","version":"1.0.0"}}}\n' \
            | docker run --rm -i --read-only --tmpfs /tmp:rw,noexec,nosuid coldpin:smoke mcp | head -n 1)"
          echo "Container MCP initialize: ${init_out}"
          printf '%s' "$init_out" | jq -e --arg v "$PKG_VER" '.result.serverInfo.name == "coldpin" and .result.serverInfo.version == $v' >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/coldpin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest,enable=${{ !contains(needs.build-and-verify.outputs.release_tag, '-') }}

      - name: Build and push multi-arch OCI image to GHCR
        id: build_push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest SLSA build provenance for GHCR image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/coldpin
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true
